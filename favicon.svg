<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Green background matching navbar -->
  <rect width="32" height="32" fill="#1b5e20"/>
  
  <!-- Background circle for academic feel -->
  <circle cx="16" cy="16" r="15" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
  
  <!-- Data points with enhanced styling (matching navbar) -->
  <circle cx="4" cy="28" r="2.5" fill="white"/>
  <circle cx="12" cy="20" r="2.5" fill="white"/>
  <circle cx="20" cy="12" r="2.5" fill="white"/>
  <circle cx="28" cy="8" r="2.5" fill="white"/>
  
  <!-- Connecting lines with better weight and rounded caps -->
  <polyline points="4,28 12,20 20,12 28,8" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Small accent dots for personality -->
  <circle cx="8" cy="24" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="16" cy="16" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="24" cy="10" r="0.8" fill="white" opacity="0.7"/>
</svg> 